<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lol-coach</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">lol-coach</a>
  <span id="who" class="muted"></span>
  <span class="spacer"></span>
  <button id="refresh" class="ghost" type="button">Refresh</button>
  <button id="chattoggle" class="primary" type="button" aria-expanded="false" aria-controls="chat">Coach</button>
</header>
<main id="view"><p class="muted pad">Loading your games…</p></main>
<aside id="chat" class="chat" hidden aria-label="Chat with your coach">
  <div class="chathead"><b>Coach</b><span class="spacer"></span>
    <button id="chatnew" class="ghost small" type="button">New chat</button>
    <button id="chatclose" class="ghost small" type="button" aria-label="Close chat">✕</button></div>
  <div id="chatlog" class="chatlog" aria-live="polite"></div>
  <form id="chatform" class="chatform">
    <textarea id="chatinput" rows="2" placeholder="Ask your coach…" aria-label="Message"></textarea>
    <button id="chatsend" class="primary" type="submit">Send</button>
  </form>
  <p class="muted small chatnote">Runs on the Claude Code login on this computer.</p>
</aside>
<div id="tip" class="tip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
